services:
  opendocuments:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - opendocuments-data:/data
    environment:
      OPENDOCUMENTS_DATA_DIR: /data
      NODE_ENV: production
      OPENDOCUMENTS_MODEL_PROVIDER: ${OPENDOCUMENTS_MODEL_PROVIDER:-ollama}
      OPENDOCUMENTS_MODEL_BASE_URL: ${OPENDOCUMENTS_MODEL_BASE_URL:-http://ollama:11434}
      OPENDOCUMENTS_MODEL_API_KEY: ${OPENDOCUMENTS_MODEL_API_KEY:-}
      OPENDOCUMENTS_MODEL_LLM: ${OPENDOCUMENTS_MODEL_LLM:-qwen2.5:14b}
      OPENDOCUMENTS_MODEL_EMBEDDING: ${OPENDOCUMENTS_MODEL_EMBEDDING:-mxbai-embed-large}
    restart: unless-stopped
    depends_on:
      ollama:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/healthz"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3

  ollama:
    image: ${OLLAMA_IMAGE:-ollama/ollama:0.32.0}
    profiles: ["with-ollama"]
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

volumes:
  opendocuments-data:
  ollama_models:

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  OPENDOCUMENTS_PROBE_RETRIES: "1"
  OPENDOCUMENTS_PROBE_DELAY_MS: "0"

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}

      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: git diff --check
      - run: npm test
